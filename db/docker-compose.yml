version: '3.8'

services:
  db:
    image: postgres
    restart: always
    container_name: dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zero
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    container_name: dev-adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:

